name: koopcare
description: A new Flutter project
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.1
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^19.0.0

  # ── Clean Architecture stack ────────────────────────────────────────────
  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Functional error handling (Either<Failure, Success>)
  dartz: ^0.10.1

  # Networking (used progressively as features migrate from `http`)
  dio: ^5.7.0

  # Dependency injection
  get_it: ^7.7.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
